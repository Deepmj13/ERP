name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — format, typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://erp:erp_dev@localhost:5432/erp_test
      DIRECT_URL: postgresql://erp:erp_dev@localhost:5432/erp_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_dev
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 2s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npx prettier --check . --ignore-path ../.prettierignore

      - name: Typecheck (lint)
        run: npm run lint

      - name: Database — validate schema + migrate
        run: npm run db:migrate:deploy

      - name: Database — generate client
        run: npm run gen:prisma

      - name: Unit tests
        run: npm test

      - name: Build all
        run: npm run build

  flutter:
    name: Flutter — analyze, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web
